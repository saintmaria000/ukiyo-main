<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ukiyo Film</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root{
      --bg:#000;
      --fg:rgba(255,255,255,.92);
      --fg-soft:rgba(255,255,255,.68);
      --fg-faint:rgba(255,255,255,.42);
      --line:rgba(255,255,255,.14);

      --logo-main-size:clamp(2.4rem, 7vw, 5.8rem);
      --logo-sub-size:clamp(.78rem, 1.25vw, 1rem);
      --copy-size:clamp(.72rem, 1vw, .9rem);
      --lang-size:clamp(.78rem, 1.1vw, .92rem);

      --safe-x:clamp(20px, 4vw, 40px);
      --safe-y:clamp(22px, 4vh, 42px);

      --logo-gap:clamp(10px, 1.2vw, 16px);
      --copy-gap:clamp(16px, 2vh, 24px);
      --lang-gap:clamp(10px, 1.6vw, 18px);

      --fade-duration:1400ms;
      --blur-bg:14px;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,
    body{
      width:100%;
      min-height:100%;
      background:var(--bg);
      color:var(--fg);
      font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif;
      overflow:hidden;
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }

    body{
      position:relative;
      isolation:isolate;
    }

    canvas,
    .bg-glow,
    .bg-vignette{
      position:fixed;
      inset:0;
    }

    #particle-canvas{
      z-index:0;
      width:100%;
      height:100%;
      display:block;
    }

    .bg-glow{
      z-index:1;
      pointer-events:none;
      background:
        radial-gradient(
          circle at 50% 42%,
          rgba(255,255,255,.07) 0%,
          rgba(255,255,255,.025) 20%,
          rgba(255,255,255,0) 52%
        ),
        radial-gradient(
          circle at 50% 50%,
          rgba(255,255,255,.03) 0%,
          rgba(255,255,255,0) 58%
        );
      filter:blur(26px);
      opacity:.9;
    }

    .bg-vignette{
      z-index:2;
      pointer-events:none;
      background:
        radial-gradient(
          ellipse at center,
          rgba(0,0,0,0) 42%,
          rgba(0,0,0,.24) 72%,
          rgba(0,0,0,.52) 100%
        );
    }

    .entrance{
      position:relative;
      z-index:3;
      min-height:100svh;
      min-height:100vh;
      display:grid;
      grid-template-rows:1fr auto auto;
      padding:var(--safe-y) var(--safe-x);
    }

    .brand-wrap{
      align-self:center;
      justify-self:center;
      width:min(92vw, 900px);
      text-align:center;
      display:grid;
      justify-items:center;
      gap:var(--copy-gap);
      opacity:0;
      transform:translateY(10px);
      animation:fadeUp var(--fade-duration) ease forwards;
    }

    .brand{
      display:grid;
      justify-items:center;
      gap:var(--logo-gap);
    }

    .logo-main{
      font-size:var(--logo-main-size);
      font-weight:300;
      line-height:.92;
      letter-spacing:.28em;
      text-transform:lowercase;
      color:var(--fg);
      padding-left:.28em;
      text-wrap:balance;
    }

    .logo-sub{
      font-size:var(--logo-sub-size);
      line-height:1.2;
      letter-spacing:.42em;
      text-transform:uppercase;
      color:var(--fg-soft);
      padding-left:.42em;
    }

    .brand-copy{
      max-width:36rem;
      font-size:var(--copy-size);
      line-height:1.8;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--fg-faint);
      text-wrap:balance;
    }

    .lang-nav{
      align-self:end;
      justify-self:center;
      width:min(92vw, 520px);
      opacity:0;
      transform:translateY(12px);
      animation:fadeUp var(--fade-duration) ease .22s forwards;
    }

    .lang-list{
      list-style:none;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:var(--lang-gap);
      padding:0;
      margin:0;
    }

    .lang-list li{
      display:flex;
      align-items:center;
    }

    .lang-list li + li::before{
      content:"";
      display:block;
      width:22px;
      height:1px;
      margin-right:var(--lang-gap);
      background:var(--line);
    }

    .lang-link{
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:60px;
      min-height:42px;
      padding:10px 12px;
      color:var(--fg-soft);
      font-size:var(--lang-size);
      line-height:1;
      letter-spacing:.28em;
      text-transform:uppercase;
      text-decoration:none;
      transition:
        color .28s ease,
        opacity .28s ease,
        transform .28s ease;
      outline:none;
    }

    .lang-link::after{
      content:"";
      position:absolute;
      left:12px;
      right:12px;
      bottom:8px;
      height:1px;
      background:rgba(255,255,255,.55);
      transform:scaleX(0);
      transform-origin:center;
      transition:transform .28s ease;
    }

    .lang-link:hover,
    .lang-link:focus-visible{
      color:var(--fg);
      transform:translateY(-1px);
    }

    .lang-link:hover::after,
    .lang-link:focus-visible::after{
      transform:scaleX(1);
    }

    .footer-note{
      justify-self:center;
      margin-top:18px;
      font-size:.68rem;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:rgba(255,255,255,.26);
      opacity:0;
      animation:fadeIn 1800ms ease .65s forwards;
      user-select:none;
      pointer-events:none;
    }

    @keyframes fadeUp{
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes fadeIn{
      to{
        opacity:1;
      }
    }

    @media (max-width: 640px){
      .entrance{
        grid-template-rows:1fr auto auto;
      }

      .logo-main{
        letter-spacing:.22em;
        padding-left:.22em;
      }

      .logo-sub{
        letter-spacing:.34em;
        padding-left:.34em;
      }

      .brand-copy{
        width:min(88vw, 28rem);
        letter-spacing:.13em;
        line-height:1.7;
      }

      .lang-list li + li::before{
        width:16px;
      }

      .lang-link{
        min-width:56px;
        min-height:40px;
        padding:10px 10px;
      }
    }

    @media (max-height: 560px){
      .entrance{
        padding-top:18px;
        padding-bottom:18px;
      }

      .brand-wrap{
        gap:12px;
      }

      .brand{
        gap:8px;
      }

      .footer-note{
        margin-top:10px;
      }
    }

    @media (prefers-reduced-motion: reduce){
      .brand-wrap,
      .lang-nav,
      .footer-note{
        animation:none;
        opacity:1;
        transform:none;
      }

      .lang-link{
        transition:none;
      }
    }
  </style>
</head>
<body>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="bg-vignette" aria-hidden="true"></div>

  <main class="entrance">
    <section class="brand-wrap" aria-label="Site introduction">
      <div class="brand">
        <h1 class="logo-main">ukiyo</h1>
        <p class="logo-sub">Film</p>
      </div>

      <!-- <p class="brand-copy">
        Moving images, quiet tension, and fleeting moments.
      </p> -->
    </section>

    <nav class="lang-nav" aria-label="Language selection">
      <ul class="lang-list">
        <li><a class="lang-link" href="ja/index.html" lang="ja">JA</a></li>
        <li><a class="lang-link" href="en/index.html" lang="en">EN</a></li>
      </ul>
    </nav>

    <div class="footer-note">Select language to enter</div>
  </main>

  <script>
(() => {
  const canvas = document.getElementById("particle-canvas");
  const ctx = canvas.getContext("2d");

  let w = 0;
  let h = 0;
  let dpr = 1;
  let time = 0;
  let animationId = null;

  const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");

  const CONFIG = {
    orbScale: 0.155,
    orbMin: 110,
    orbMax: 250,

    outlineAlpha: 0.055,
    glowAlpha: 0.028,
    coreAlpha: 0.020,

    wave1Amp: 0.020,
    wave2Amp: 0.012,
    wave3Amp: 0.008,
    wave4Amp: 0.005,

    speed: 0.48,

    bandCount: 5,
    bandAlpha: 0.010,

    textureCols: 64,
    textureRows: 64,
    textureAlpha: 0.016,

    causticLines: 16,
    causticAlpha: 0.010
  };

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function resize() {
    w = window.innerWidth;
    h = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = `${w}px`;
    canvas.style.height = `${h}px`;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function getCenter() {
    return {
      x: w * 0.5,
      y: h * 0.5
    };
  }

  function getOrbRadius() {
    const base = clamp(Math.min(w, h) * CONFIG.orbScale, CONFIG.orbMin, CONFIG.orbMax);
    return base * (1 + Math.sin(time * 0.16) * 0.010);
  }

  function radiusAt(theta, baseR, t) {
    const wave1 = Math.sin(theta * 2.0 + t * 0.65) * baseR * CONFIG.wave1Amp;
    const wave2 = Math.sin(theta * 3.0 - t * 0.42 + 0.9) * baseR * CONFIG.wave2Amp;
    const wave3 = Math.sin(theta * 5.0 + t * 0.24 - 1.2) * baseR * CONFIG.wave3Amp;
    const wave4 = Math.sin(theta * 8.0 - t * 0.16 + 2.1) * baseR * CONFIG.wave4Amp;
    const breath = Math.sin(t * 0.12) * baseR * 0.006;

    return baseR + wave1 + wave2 + wave3 + wave4 + breath;
  }

  function buildOrbPath(cx, cy, baseR, t) {
    const steps = 220;
    const pts = [];

    for (let i = 0; i <= steps; i++) {
      const theta = (i / steps) * Math.PI * 2;
      const r = radiusAt(theta, baseR, t);
      pts.push({
        x: cx + Math.cos(theta) * r,
        y: cy + Math.sin(theta) * r
      });
    }

    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);

    for (let i = 1; i < pts.length - 2; i++) {
      const xc = (pts[i].x + pts[i + 1].x) * 0.5;
      const yc = (pts[i].y + pts[i + 1].y) * 0.5;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, xc, yc);
    }

    ctx.quadraticCurveTo(
      pts[pts.length - 2].x,
      pts[pts.length - 2].y,
      pts[0].x,
      pts[0].y
    );

    ctx.closePath();
  }

  function drawBackground() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, h);
  }

  function drawAmbientVoid(cx, cy, r, t) {
    const driftX = Math.sin(t * 0.18) * r * 0.03;
    const driftY = Math.cos(t * 0.14) * r * 0.03;

    const g = ctx.createRadialGradient(
      cx + driftX,
      cy + driftY,
      r * 0.18,
      cx,
      cy,
      r * 2.2
    );

    g.addColorStop(0, "rgba(255,255,255,0.018)");
    g.addColorStop(0.35, "rgba(255,255,255,0.008)");
    g.addColorStop(0.7, "rgba(255,255,255,0.003)");
    g.addColorStop(1, "rgba(255,255,255,0)");

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 2.3, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawShadow(cx, cy, r) {
    const g = ctx.createRadialGradient(
      cx,
      cy + r * 0.34,
      r * 0.15,
      cx,
      cy + r * 0.34,
      r * 1.0
    );

    g.addColorStop(0, "rgba(0,0,0,0.16)");
    g.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(cx, cy + r * 0.36, r * 0.72, r * 0.40, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawOrbBody(cx, cy, r, t) {
    buildOrbPath(cx, cy, r, t);

    const body = ctx.createRadialGradient(
      cx - r * 0.24,
      cy - r * 0.28,
      r * 0.05,
      cx,
      cy,
      r * 1.15
    );

    body.addColorStop(0, "rgba(255,255,255,0.085)");
    body.addColorStop(0.28, "rgba(255,255,255,0.038)");
    body.addColorStop(0.56, "rgba(255,255,255,0.022)");
    body.addColorStop(0.8, `rgba(255,255,255,${CONFIG.coreAlpha})`);
    body.addColorStop(1, "rgba(255,255,255,0.010)");

    ctx.fillStyle = body;
    ctx.fill();

    ctx.strokeStyle = `rgba(255,255,255,${CONFIG.outlineAlpha})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawRefractionTexture(cx, cy, r, t) {
    ctx.save();
    buildOrbPath(cx, cy, r, t);
    ctx.clip();

    const cols = CONFIG.textureCols;
    const rows = CONFIG.textureRows;
    const cellW = (r * 2.16) / cols;
    const cellH = (r * 2.16) / rows;

    for (let iy = 0; iy < rows; iy++) {
      for (let ix = 0; ix < cols; ix++) {
        const px = cx - r * 1.08 + ix * cellW;
        const py = cy - r * 1.08 + iy * cellH;

        const nx = (px - cx) / r;
        const ny = (py - cy) / r;
        const dist = Math.sqrt(nx * nx + ny * ny);

        if (dist > 1.02) continue;

        const v =
          Math.sin(nx * 5.8 + t * 0.72) +
          Math.sin(ny * 6.6 - t * 0.56) +
          Math.sin((nx + ny) * 4.4 + t * 0.34) +
          Math.sin((nx - ny) * 3.8 - t * 0.22);

        const alpha = ((v + 4) / 8) * CONFIG.textureAlpha;

        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.fillRect(px, py, cellW + 0.35, cellH + 0.35);
      }
    }

    ctx.restore();
  }

  function drawInteriorBands(cx, cy, r, t) {
    ctx.save();
    buildOrbPath(cx, cy, r, t);
    ctx.clip();

    for (let i = 0; i < CONFIG.bandCount; i++) {
      const ratio = i / Math.max(CONFIG.bandCount - 1, 1);
      const yy = cy - r * 0.62 + ratio * r * 1.24;
      const amp = r * (0.010 + i * 0.0018);
      const freq = 1.2 + i * 0.20;
      const phase = t * (0.34 + i * 0.04) + i * 0.8;

      ctx.beginPath();

      for (let x = cx - r * 1.12, first = true; x <= cx + r * 1.12; x += 2.5) {
        const nx = (x - cx) / r;

        const y =
          yy +
          Math.sin(nx * Math.PI * freq + phase) * amp +
          Math.sin(nx * Math.PI * (freq * 0.62) - phase * 0.74) * amp * 0.42;

        if (first) {
          ctx.moveTo(x, y);
          first = false;
        } else {
          ctx.lineTo(x, y);
        }
      }

      ctx.strokeStyle = `rgba(255,255,255,${CONFIG.bandAlpha + i * 0.002})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawCausticLines(cx, cy, r, t) {
    ctx.save();
    buildOrbPath(cx, cy, r, t);
    ctx.clip();

    for (let i = 0; i < CONFIG.causticLines; i++) {
      const ratio = i / Math.max(CONFIG.causticLines - 1, 1);
      const yy = cy - r * 0.92 + ratio * r * 1.84;
      const phase = t * (0.52 + ratio * 0.34) + i * 0.36;
      const alpha = CONFIG.causticAlpha * (1 - Math.abs(ratio - 0.5) * 1.35);

      ctx.beginPath();

      for (let x = cx - r * 1.15, first = true; x <= cx + r * 1.15; x += 2.2) {
        const nx = (x - cx) / r;
        const y =
          yy +
          Math.sin(nx * Math.PI * 2.6 + phase) * r * 0.008 +
          Math.sin(nx * Math.PI * 5.4 - phase * 0.82) * r * 0.004;

        if (first) {
          ctx.moveTo(x, y);
          first = false;
        } else {
          ctx.lineTo(x, y);
        }
      }

      ctx.strokeStyle = `rgba(255,255,255,${Math.max(alpha, 0)})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawInnerDepth(cx, cy, r, t) {
    ctx.save();
    buildOrbPath(cx, cy, r, t);
    ctx.clip();

    const g1 = ctx.createRadialGradient(
      cx + Math.sin(t * 0.26) * r * 0.10,
      cy + Math.cos(t * 0.22) * r * 0.08,
      r * 0.06,
      cx,
      cy,
      r * 0.95
    );

    g1.addColorStop(0, "rgba(255,255,255,0.028)");
    g1.addColorStop(0.4, "rgba(255,255,255,0.010)");
    g1.addColorStop(1, "rgba(255,255,255,0)");

    ctx.fillStyle = g1;
    ctx.fillRect(cx - r * 1.2, cy - r * 1.2, r * 2.4, r * 2.4);

    const g2 = ctx.createRadialGradient(
      cx + r * 0.16,
      cy + r * 0.12,
      r * 0.12,
      cx + r * 0.12,
      cy + r * 0.16,
      r * 0.84
    );

    g2.addColorStop(0, "rgba(0,0,0,0.030)");
    g2.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = g2;
    ctx.fillRect(cx - r * 1.2, cy - r * 1.2, r * 2.4, r * 2.4);

    ctx.restore();
  }

  function drawHighlight(cx, cy, r, t) {
    const hx = cx - r * 0.26 + Math.sin(t * 0.42) * r * 0.015;
    const hy = cy - r * 0.31 + Math.cos(t * 0.30) * r * 0.015;

    const g = ctx.createRadialGradient(
      hx,
      hy,
      r * 0.01,
      hx,
      hy,
      r * 0.30
    );

    g.addColorStop(0, "rgba(255,255,255,0.12)");
    g.addColorStop(0.24, "rgba(255,255,255,0.05)");
    g.addColorStop(0.58, "rgba(255,255,255,0.015)");
    g.addColorStop(1, "rgba(255,255,255,0)");

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(hx, hy, r * 0.30, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(
      cx - r * 0.16,
      cy - r * 0.20,
      r * 0.18,
      r * 0.065,
      -0.55,
      0,
      Math.PI * 2
    );
    ctx.strokeStyle = "rgba(255,255,255,0.045)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawOuterEdge(cx, cy, r, t) {
    buildOrbPath(cx, cy, r * 1.008, t);

    const edge = ctx.createLinearGradient(
      cx - r,
      cy - r,
      cx + r,
      cy + r
    );

    edge.addColorStop(0, "rgba(255,255,255,0.010)");
    edge.addColorStop(0.5, "rgba(255,255,255,0.020)");
    edge.addColorStop(1, "rgba(255,255,255,0.008)");

    ctx.strokeStyle = edge;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function render() {
    drawBackground();

    const { x: cx, y: cy } = getCenter();
    const r = getOrbRadius();
    const t = time * CONFIG.speed;

    drawAmbientVoid(cx, cy, r, t);
    drawShadow(cx, cy, r);
    drawOrbBody(cx, cy, r, t);
    drawRefractionTexture(cx, cy, r, t);
    drawInteriorBands(cx, cy, r, t);
    drawCausticLines(cx, cy, r, t);
    drawInnerDepth(cx, cy, r, t);
    drawHighlight(cx, cy, r, t);
    drawOuterEdge(cx, cy, r, t);
  }

  function tick() {
    if (!motionQuery.matches) {
      time += 0.016;
    }
    render();
    animationId = requestAnimationFrame(tick);
  }

  function start() {
    cancelAnimationFrame(animationId);
    resize();
    render();
    tick();
  }

  window.addEventListener("resize", resize);

  if (motionQuery.addEventListener) {
    motionQuery.addEventListener("change", start);
  } else if (motionQuery.addListener) {
    motionQuery.addListener(start);
  }

  start();
})();
  </script>
</body>
