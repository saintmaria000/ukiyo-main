<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ukiyo Film</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root{
      --bg:#000;
      --fg:rgba(255,255,255,.92);
      --fg-soft:rgba(255,255,255,.68);
      --fg-faint:rgba(255,255,255,.38);
      --line:rgba(255,255,255,.12);

      --logo-main-size:clamp(2.4rem, 7vw, 5.8rem);
      --logo-sub-size:clamp(.78rem, 1.25vw, 1rem);
      --lang-size:clamp(.78rem, 1.1vw, .92rem);

      --safe-x:clamp(20px, 4vw, 40px);
      --safe-y:clamp(22px, 4vh, 42px);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,
    body{
      width:100%;
      min-height:100%;
      background:#000;
      color:var(--fg);
      font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif;
      overflow:hidden;
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }

    body{
      position:relative;
      isolation:isolate;
    }

    #particle-canvas{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      z-index:0;
    }

    .entrance{
      position:relative;
      z-index:2;
      min-height:100svh;
      min-height:100vh;
      display:grid;
      grid-template-rows:1fr auto;
      padding:var(--safe-y) var(--safe-x);
    }

    .brand{
      align-self:center;
      justify-self:center;
      text-align:center;
      opacity:1;
      transform:translateY(0);
      transition:
        opacity 500ms ease,
        transform 500ms ease;
      pointer-events:none;
    }

    .brand-main{
      font-size:var(--logo-main-size);
      font-weight:300;
      line-height:.92;
      letter-spacing:.28em;
      text-transform:lowercase;
      color:rgba(255,255,255,.88);
      padding-left:.28em;
    }

    .brand-sub{
      margin-top:10px;
      font-size:var(--logo-sub-size);
      line-height:1.2;
      letter-spacing:.42em;
      text-transform:uppercase;
      color:rgba(255,255,255,.42);
      padding-left:.42em;
    }

    .lang-select{
      align-self:end;
      justify-self:center;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      opacity:1;
      transform:translateY(0);
      transition:
        opacity 500ms ease,
        transform 500ms ease;
    }

    .lang-select.is-disabled{
      pointer-events:none;
      opacity:.35;
    }

    .lang-link{
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:56px;
      min-height:40px;
      padding:10px 12px;
      text-decoration:none;
      color:rgba(255,255,255,.72);
      font-size:var(--lang-size);
      letter-spacing:.28em;
      text-transform:uppercase;
      transition:
        color .28s ease,
        transform .28s ease,
        opacity .28s ease;
      cursor:pointer;
    }

    .lang-link::after{
      content:"";
      position:absolute;
      left:12px;
      right:12px;
      bottom:8px;
      height:1px;
      background:rgba(255,255,255,.5);
      transform:scaleX(0);
      transform-origin:center;
      transition:transform .28s ease;
    }

    .lang-link:hover,
    .lang-link:focus-visible{
      color:rgba(255,255,255,.95);
      transform:translateY(-1px);
      outline:none;
    }

    .lang-link:hover::after,
    .lang-link:focus-visible::after{
      transform:scaleX(1);
    }

    .lang-sep{
      color:rgba(255,255,255,.26);
      letter-spacing:.1em;
      user-select:none;
    }

    body.is-transitioning .brand,
    body.is-transitioning .lang-select{
      opacity:0;
      transform:translateY(8px);
    }

    .reveal-logo{
      position:fixed;
      inset:0;
      z-index:5;
      display:grid;
      place-items:center;
      text-align:center;
      pointer-events:none;
      opacity:0;
      transition:opacity 800ms ease;
    }

    .reveal-logo.is-visible{
      opacity:1;
    }

    .reveal-logo-main{
      color:rgba(255,255,255,.94);
      font-size:clamp(2.8rem, 10vw, 7rem);
      line-height:1;
      letter-spacing:.16em;
    }

    .reveal-logo-sub{
      margin-top:14px;
      color:rgba(255,255,255,.36);
      font-size:clamp(.72rem, 1.35vw, 1rem);
      letter-spacing:.30em;
      text-transform:uppercase;
    }

    @media (max-width: 640px){
      .brand-main{
        letter-spacing:.22em;
        padding-left:.22em;
      }

      .brand-sub{
        letter-spacing:.34em;
        padding-left:.34em;
      }

      .reveal-logo-main{
        letter-spacing:.12em;
      }
    }

    @media (prefers-reduced-motion: reduce){
      .brand,
      .lang-select,
      .reveal-logo{
        transition:none;
      }

      .lang-link{
        transition:none;
      }
    }
  </style>
</head>
<body>

  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <main class="entrance">
    <section class="brand" aria-label="Site introduction">
      <h1 class="brand-main">ukiyo</h1>
      <p class="brand-sub">Film</p>
    </section>

  <div class="reveal-logo" id="revealLogo" aria-hidden="true">
    <div>
      <div class="reveal-logo-main">憂き世</div>
      <div class="reveal-logo-sub">ukiyo Film</div>
    </div>
  </div>

  <script src="assets/js/entrance.js"></script>
</body>
</html>
