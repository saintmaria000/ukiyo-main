<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Ukiyo Film</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./assets/css/entrance.css">
</head>
<body>

  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <main class="entrance">
    <section class="brand" aria-label="Site introduction">

      <h1 class="brand-main">
        <span>u</span>
        <span>k</span>
        <span>i</span>
        <span>y</span>
        <span>o</span>
      </h1>

      <p class="brand-sub">
        <span>F</span>
        <span>i</span>
        <span>l</span>
        <span>m</span>
      </p>

    </section>

    <div class="reveal-logo" id="revealLogo" aria-hidden="true">
      <div>
        <div class="reveal-logo-main">憂き世</div>
        <div class="reveal-logo-sub">ukiyo Film</div>
      </div>
    </div>

    <div class="entrance-gate" id="entranceGate" aria-hidden="true">
      <div class="entrance-gate__inner">

        <div class="entrance-gate__panel" data-gate-panel="language">
          <div class="entrance-gate__links">
            <button type="button" class="entrance-gate__link" data-lang="ja">JA</button>
            <span class="entrance-gate__sep">/</span>
            <button type="button" class="entrance-gate__link" data-lang="en">EN</button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script type="module" src="assets/js/entrance/index.js"></script>

</body>
</html>
